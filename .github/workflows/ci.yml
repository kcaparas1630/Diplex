# Runs on every pull request and on main: the convention checker, the engine and script tests, and the engine image:
# built, its unoserver pool tested with the image's own LibreOffice, then started and checked over HTTP. See convention 005.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Convention checker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m scripts.conventions

  engine-tests:
    name: Engine and script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - name: Install the engine and its test tools
        working-directory: core
        run: uv sync --locked
      - name: Engine tests
        working-directory: core
        run: uv run pytest
      - name: Script tests (convention checker, smoke test, load test)
        run: uv run --project core python -m pytest scripts

  engine-image:
    name: Engine image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - uses: docker/setup-buildx-action@v4
      - name: Build the image from the root Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: diplex-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the engine with two unoserver instances
        run: |
          docker run -d --name diplex-engine -p 127.0.0.1:8000:8000 -e DIPLEX_UNOSERVER_INSTANCES=2 diplex-core:ci
          for attempt in $(seq 1 90); do
            if [ "$(docker logs diplex-engine 2>&1 | grep -c 'ready in')" -ge 2 ]; then break; fi
            sleep 1
          done
          docker logs diplex-engine 2>&1 | grep 'diplex.unoserver_pool'
          test "$(docker logs diplex-engine 2>&1 | grep -c 'ready in')" -ge 2
      - name: Pool tests with the image's own LibreOffice and unoserver
        # As root, so the test venv can be written into the checkout; LibreOffice and unoserver are the image's.
        run: |
          docker run --rm --user root -v "$PWD:/repo" -w /repo/core \
            -e UV_PROJECT_ENVIRONMENT=/tmp/test-venv -e UV_PYTHON_DOWNLOADS=never diplex-core:ci \
            sh -c "uv sync --locked --python /usr/bin/python3 && uv run pytest -p no:cacheprovider tests/test_unoserver_pool_with_libreoffice.py -rs"
      - name: Container tests over HTTP
        working-directory: core
        run: |
          uv sync --locked
          DIPLEX_ENGINE_URL=http://127.0.0.1:8000 uv run pytest tests/test_engine_container.py -rs
      - name: docker stop stops the engine and its pool within 10 s
        run: |
          started=$(date +%s)
          docker stop diplex-engine
          test $(( $(date +%s) - started )) -lt 10
          docker logs diplex-engine 2>&1 | tail -5
      - name: With no egress, the engine can't reach out but its consumers reach it (ADR 013)
        run: |
          docker network create --internal diplex-no-egress
          docker run -d --name diplex-isolated --network diplex-no-egress diplex-core:ci
          sleep 3
          # From inside the engine, any outbound connection must fail.
          if docker exec diplex-isolated python3 -c "import socket; socket.create_connection(('1.1.1.1', 443), timeout=3)"; then
            echo "the engine reached the internet" && exit 1
          fi
          # A container on the same internal network, like the consumer's app, reaches /health.
          docker run --rm --network diplex-no-egress diplex-core:ci \
            python3 -c "import urllib.request; assert urllib.request.urlopen('http://diplex-isolated:8000/health', timeout=10).status == 200"
          docker stop diplex-isolated
      - name: Locked down (read-only root, no capabilities, no new privileges), the pool still starts (ADR 014)
        run: |
          docker run -d --name diplex-locked --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e DIPLEX_UNOSERVER_INSTANCES=2 -p 127.0.0.1:8001:8000 diplex-core:ci
          for attempt in $(seq 1 90); do
            if [ "$(docker logs diplex-locked 2>&1 | grep -c 'ready in')" -ge 2 ]; then break; fi
            sleep 1
          done
          docker logs diplex-locked 2>&1 | grep -E 'diplex.unoserver_pool|Error|error' || true
          test "$(docker logs diplex-locked 2>&1 | grep -c 'ready in')" -ge 2
          curl -fsS http://127.0.0.1:8001/health
          docker stop diplex-locked
