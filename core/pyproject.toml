[project]
name = "diplex-core"
version = "0.1.0"
description = "The Diplex rendering engine: a DOCX or PDF in, the PDF and an image of every page out."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pypdfium2>=5.14",  # Apache-2.0 / BSD-3-Clause: opens the converted PDFs in the sample tests
    "pytest>=9.1",  # MIT
]

[build-system]
requires = ["hatchling==1.32.4"]  # MIT
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diplex_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
